[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tomato-supervisor"
version = "0.1.0"
description = "Evidence-driven tomato harvesting supervisor; replay and read-only SDK integration"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tomato-agent = "tomato_agent.cli:main"
tomato-agent-online = "tomato_agent.online.runner:main"
tomato-pi05-stages = "tomato_agent.stage_server:main"

[tool.setuptools.packages.find]
where = ["src"]
